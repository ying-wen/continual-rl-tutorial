<svg xmlns="http://www.w3.org/2000/svg" width="400" height="954" viewBox="0 0 400 954" role="img" aria-labelledby="crl-o0pdis-title crl-o0pdis-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-o0pdis-title">同一世界：option 停止以后，任务仍继续</title><desc id="crl-o0pdis-desc">六个物理状态S、A、B、C、X、Y，只画给定的S到A到X和S到B到C到Y。蓝箭头是route option内部行为，A与C的双圈是option停止位置，调用时长分别为1和2条原子转移；青箭头是在停止之后的给定续行，外部奖励分别为1和2，其余图中边奖励零。黑色方形X和Y才结束物理任务。概率为给定旧策略，数据由knowledge_transport.py demo输出；这是精确有限诊断，不是训练或性能实验。</desc><rect width="400" height="954" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="38" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一世界：option 停止以后</text><text x="24" y="67" font-size="20" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">任务仍然继续</text><text x="24" y="106" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">六个物理状态 · γ=0.9</text><text x="24" y="135" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧策略；每条箭头是一条原子转移</text><path d="M76.5478 291.7628L156.9558 226.7269" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M162.0096 222.6393L157.3788 232.8155L151.0901 225.0404Z" fill="#146ca1"/><path d="M225 200L314.5 200" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M321 200L311 205L311 195Z" fill="#258375"/><path d="M68.4241 335.1584L122.3429 429.2027" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M125.5759 434.8416L116.2644 428.6532L124.9397 423.6794Z" fill="#146ca1"/><path d="M169 460L243.5 460" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M250 460L240 465L240 455Z" fill="#146ca1"/><path d="M286 495L286 574.5" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M286 581L281 571L291 571Z" fill="#258375"/><circle cx="54" cy="310" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="54" y="317" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">S</text><circle cx="190" cy="200" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="190" cy="200" r="34" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="190" y="207" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="140" cy="460" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="140" y="467" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">B</text><circle cx="286" cy="460" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="286" cy="460" r="34" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="286" y="467" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">C</text><rect x="322" y="172" width="56" height="56" rx="3" fill="#19354e" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="350" y="207" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="600" opacity="1">X</text><rect x="258" y="582" width="56" height="56" rx="3" fill="#19354e" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="286" y="617" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="600" opacity="1">Y</text><text x="95" y="214" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">upper</text><text x="95" y="238" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">p=0.75</text><text x="32" y="410" font-size="18" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">lower</text><text x="32" y="434" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">p=0.25</text><text x="213" y="420" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">forward</text><text x="270" y="165" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">exit · +1</text><text x="308" y="540" font-size="18" fill="#258375" text-anchor="start" font-weight="400" opacity="1">probe</text><text x="308" y="567" font-size="20" fill="#258375" text-anchor="start" font-weight="400" opacity="1">+2</text><text x="190" y="254" font-size="19" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">τ=1</text><text x="242" y="512" font-size="19" fill="#146ca1" text-anchor="end" font-weight="400" opacity="1">τ=2</text><text x="350" y="254" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终止</text><text x="286" y="665" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">终止</text><path d="M25 706L55.5 706" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M62 706L52 711L52 701Z" fill="#146ca1"/><text x="77" y="713" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">route option 内部行为</text><path d="M25 743L55.5 743" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M62 743L52 748L52 738Z" fill="#258375"/><text x="77" y="750" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">给定续行；外部奖励见箭头</text><text x="77" y="777" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">其余边外部奖励为 0</text><circle cx="43" cy="823" r="13" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="43" cy="823" r="19" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="43" y="830" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><text x="77" y="820" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">双圈：option 停止</text><text x="77" y="847" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">物理任务仍继续</text><text x="24" y="894" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">τ：原子转移 / 次 option 调用</text><text x="24" y="923" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">给定策略的精确诊断；无训练结果</text></g></svg>
