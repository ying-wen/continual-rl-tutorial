<svg xmlns="http://www.w3.org/2000/svg" width="900" height="814" viewBox="0 0 900 814" role="img" aria-labelledby="crl-z9trkn-title crl-z9trkn-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-z9trkn-title">坐标、行为与信息损失，改变的是不同对象</title><desc id="crl-z9trkn-desc">左面板在可逆坐标交换后同时搬运端点核与续行读出，Q从1.08保持为1.08；颜色跟踪物理端点，交叉箭头表示坐标交换。中面板坐标固定，upper概率从0.75变为0.25，A和C概率的面积条随之变化；Q条长由1.08变为1.44，跨过同一reference 1.26，指定两选项的排序反转。右面板将A和C映到同一Z，共享读出无法同时给出1和2，数轴中点显示最小可能最大误差为0.5。数值来自Python精确有限诊断，未训练任何学习器。手机版将同样三个面板竖直排列。</desc><rect width="900" height="814" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">坐标、行为与信息损失，改变的是不同对象</text><text x="24" y="78" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一有限任务 · Q：外部奖励单位</text><rect x="24" y="114" width="274" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(24 114)"><text x="16" y="34" font-size="22" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1 · 只换坐标</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物理行为不变，读出同步搬运</text><text x="50" y="99" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">旧坐标</text><text x="224" y="99" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">新坐标</text><path d="M72.4654 142.9769L196.1263 225.4175" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M201.5346 229.0231L190.4406 227.6363L195.9876 219.3158Z" fill="#146ca1"/><circle cx="50" cy="128" r="23" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="50" y="135" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="224" cy="244" r="23" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="224" y="251" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">C</text><text x="50" y="175" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><text x="224" y="291" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><path d="M72.4654 229.0231L196.1263 146.5825" fill="none" stroke="#258375" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M201.5346 142.9769L195.9876 152.6842L190.4406 144.3637Z" fill="#258375"/><circle cx="50" cy="244" r="23" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="50" y="251" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">C</text><circle cx="224" cy="128" r="23" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="224" y="135" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">A</text><text x="50" y="291" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><text x="224" y="175" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><text x="16" y="329" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只展开 A / C 的端点坐标</text><text x="16" y="365" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 K：(0.675, 0.2025)</text><text x="16" y="395" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新 K：(0.2025, 0.675)</text><text x="16" y="455" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧</text><rect x="54" y="438" width="123.525" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="184.525" y="455" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="16" y="498" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新</text><rect x="54" y="481" width="123.525" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="184.525" y="498" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="16" y="539" font-size="22" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Q：1.08 → 1.08</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">相同颜色追踪相同物理端点</text></g><rect x="313" y="114" width="274" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(313 114)"><text x="16" y="34" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">2 · 同坐标，行为改变</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">upper 概率决定到达 A 或 C</text><text x="18" y="117" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧：P(upper | S)=0.75</text><rect x="18" y="133" width="178.5" height="25" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><rect x="196.5" y="133" width="59.5" height="25" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="107.25" y="152" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="226.25" y="152" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="18" y="202" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">当前：P(upper | S)=0.25</text><rect x="18" y="218" width="59.5" height="25" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><rect x="77.5" y="218" width="178.5" height="25" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="47.75" y="237" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="166.75" y="237" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="16" y="302" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">reference = 1.26</text><path d="M190.3625 320L190.3625 493" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><text x="16" y="353" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧</text><rect x="62" y="335" width="110.025" height="25" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="71" y="354" font-size="17" fill="#ffffff" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="62" y="393" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">选择 reference</text><text x="16" y="452" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">当前</text><rect x="62" y="434" width="146.7" height="25" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="71" y="453" font-size="17" fill="#ffffff" text-anchor="start" font-weight="400" opacity="1">1.44</text><text x="62" y="492" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">选择 route</text><path d="M62 510L225 510" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="62" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长为 Q；虚线是同一参照值</text></g><rect x="602" y="114" width="274" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(602 114)"><text x="16" y="34" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">3 · A / C 合并成 Z</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">行为未改；两个条件答案</text><text x="16" y="92" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">压到同一坐标</text><path d="M69.359 152.2058L116.8057 220.8034" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M120.5032 226.1493L110.7025 220.7692L118.9269 215.0806Z" fill="#7854a2"/><path d="M204.641 152.2058L157.1943 220.8034" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M153.4968 226.1493L155.0731 215.0806L163.2975 220.7692Z" fill="#7854a2"/><circle cx="54" cy="130" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="54" y="137" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="220" cy="130" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="220" y="137" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">C</text><text x="54" y="178" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><text x="220" y="178" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><circle cx="137" cy="250" r="27" fill="#ffffff" stroke="#7854a2" stroke-width="2.5" opacity="1"/><text x="137" y="257" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="600" opacity="1">Z</text><text x="137" y="302" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">只能共用一个读出 c</text><path d="M32 365L242 365" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="32" cy="365" r="6" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="32" y="342" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A=1</text><circle cx="242" cy="365" r="6" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="242" y="342" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">C=2</text><circle cx="137" cy="365" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M137 375L137 416" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="137" y="445" font-size="19" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">c=1.5</text><path d="M32 394L137 394" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M137 394L242 394" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M32 388L32 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M137 388L137 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M242 388L242 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="84.5" y="422" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="189.5" y="422" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="137" y="491" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">max(|c−1|, |c−2|)</text><text x="137" y="529" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">最小可能最大误差 ≥ 0.5</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">中点给出最小最大读出误差</text></g><text x="24" y="760" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">K 已包含 γ^τ；所有量由同一脚本精确计算</text><text x="24" y="790" font-size="19" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">给定策略与读出；不是训练曲线或方法优势</text></g></svg>
