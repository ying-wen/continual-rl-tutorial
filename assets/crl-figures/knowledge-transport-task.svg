<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="crl-1l5b12z-title crl-1l5b12z-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-1l5b12z-title">同一世界：option 停止以后，任务仍继续</title><desc id="crl-1l5b12z-desc">六个物理状态S、A、B、C、X、Y，只画给定的S到A到X和S到B到C到Y。蓝箭头是route option内部行为，A与C的双圈是option停止位置，调用时长分别为1和2条原子转移；青箭头是在停止之后的给定续行，外部奖励分别为1和2，其余图中边奖励零。黑色方形X和Y才结束物理任务。概率为给定旧策略，数据由knowledge_transport.py demo输出；这是精确有限诊断，不是训练或性能实验。</desc><rect width="900" height="565" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="39" font-size="26" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">同一世界：option 停止以后，任务仍继续</text><text x="24" y="77" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">六个物理状态 · γ=0.9</text><text x="24" y="106" font-size="20" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">旧策略；每条箭头是一条原子转移</text><path d="M137.2274 260.0166L370.0978 174.6308" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M376.2005 172.3932L368.533 180.5301L365.0904 171.1413Z" fill="#146ca1"/><path d="M445 160L754.5 160" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M761 160L751 165L751 155Z" fill="#258375"/><path d="M136.183 282.4681L287.9485 354.7374" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M293.817 357.5319L282.6388 357.7469L286.9381 348.7183Z" fill="#146ca1"/><path d="M349 370L517.5 370" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M524 370L514 375L514 365Z" fill="#146ca1"/><path d="M595 370L754.5 370" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M761 370L751 375L751 365Z" fill="#258375"/><circle cx="110" cy="270" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="110" y="277" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">S</text><circle cx="410" cy="160" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="410" cy="160" r="34" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="410" y="167" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="320" cy="370" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="320" y="377" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">B</text><circle cx="560" cy="370" r="28" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="560" cy="370" r="34" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="560" y="377" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">C</text><rect x="762" y="132" width="56" height="56" rx="3" fill="#19354e" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="790" y="167" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="600" opacity="1">X</text><rect x="762" y="342" width="56" height="56" rx="3" fill="#19354e" stroke="#19354e" stroke-width="1.5" opacity="1"/><text x="790" y="377" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="600" opacity="1">Y</text><text x="225" y="179" font-size="19" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">upper</text><text x="225" y="206" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">p=0.75</text><text x="176" y="353" font-size="19" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">lower</text><text x="176" y="379" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">p=0.25</text><text x="440" y="344" font-size="19" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">forward</text><text x="600" y="128" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">exit · +1</text><text x="677" y="340" font-size="20" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">probe · +2</text><text x="410" y="220" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">τ=1</text><text x="560" y="429" font-size="20" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">τ=2</text><text x="790" y="220" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">episode 终止</text><text x="790" y="429" font-size="18" fill="#19354e" text-anchor="middle" font-weight="400" opacity="1">episode 终止</text><path d="M28 480L60.5 480" fill="none" stroke="#146ca1" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M67 480L57 485L57 475Z" fill="#146ca1"/><text x="82" y="487" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">option 内部行为</text><path d="M310 480L342.5 480" fill="none" stroke="#258375" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M349 480L339 485L339 475Z" fill="#258375"/><text x="364" y="487" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">给定续行；非零外部奖励见箭头，其余为 0</text><circle cx="43" cy="529" r="13" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><circle cx="43" cy="529" r="19" fill="none" stroke="#146ca1" stroke-width="2" opacity="1"/><text x="43" y="536" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><text x="78" y="536" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">双圈仅表示 option 停止</text><text x="380" y="536" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">τ：原子转移 / 次调用；给定策略，无训练结果</text></g></svg>
