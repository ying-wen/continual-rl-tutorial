<svg xmlns="http://www.w3.org/2000/svg" width="400" height="2111" viewBox="0 0 400 2111" role="img" aria-labelledby="crl-8lbvv8-title crl-8lbvv8-desc" data-crl-visual="v1" data-evidence-kind="exact"><title id="crl-8lbvv8-title">坐标、行为与信息损失，改变的是不同对象</title><desc id="crl-8lbvv8-desc">左面板在可逆坐标交换后同时搬运端点核与续行读出，Q从1.08保持为1.08；颜色跟踪物理端点，交叉箭头表示坐标交换。中面板坐标固定，upper概率从0.75变为0.25，A和C概率的面积条随之变化；Q条长由1.08变为1.44，跨过同一reference 1.26，指定两选项的排序反转。右面板将A和C映到同一Z，共享读出无法同时给出1和2，数轴中点显示最小可能最大误差为0.5。数值来自Python精确有限诊断，未训练任何学习器。手机版将同样三个面板竖直排列。</desc><rect width="400" height="2111" fill="#ffffff"/><g font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><text x="24" y="37" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">坐标、行为与信息损失</text><text x="24" y="67" font-size="21" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">改变的是不同对象</text><text x="24" y="104" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">同一有限任务 · Q：外部奖励单位</text><rect x="24" y="134" width="352" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(24 134)"><text x="16" y="34" font-size="22" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1 · 只换坐标</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">物理行为不变，读出同步搬运</text><text x="50" y="99" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">旧坐标</text><text x="302" y="99" font-size="17" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">新坐标</text><path d="M74.5263 139.2899L271.5692 229.9922" fill="none" stroke="#146ca1" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M277.4737 232.7101L266.2992 233.0706L270.4806 223.9868Z" fill="#146ca1"/><circle cx="50" cy="128" r="23" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="50" y="135" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="302" cy="244" r="23" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="302" y="251" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">C</text><text x="50" y="175" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><text x="302" y="291" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><path d="M74.5263 232.7101L271.5692 142.0078" fill="none" stroke="#258375" stroke-width="2.5" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M277.4737 139.2899L270.4806 148.0132L266.2992 138.9294Z" fill="#258375"/><circle cx="50" cy="244" r="23" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="50" y="251" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">C</text><circle cx="302" cy="128" r="23" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="302" y="135" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">A</text><text x="50" y="291" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><text x="302" y="175" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><text x="16" y="329" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">只展开 A / C 的端点坐标</text><text x="16" y="365" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧 K：(0.675, 0.2025)</text><text x="16" y="395" font-size="16" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新 K：(0.2025, 0.675)</text><text x="16" y="455" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧</text><rect x="54" y="438" width="176.175" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="237.175" y="455" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="16" y="498" font-size="18" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">新</text><rect x="54" y="481" width="176.175" height="22" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="237.175" y="498" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="16" y="539" font-size="22" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">Q：1.08 → 1.08</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">相同颜色追踪相同物理端点</text></g><rect x="24" y="760" width="352" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(24 760)"><text x="16" y="34" font-size="21" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">2 · 同坐标，行为改变</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">upper 概率决定到达 A 或 C</text><text x="18" y="117" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧：P(upper | S)=0.75</text><rect x="18" y="133" width="237" height="25" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><rect x="255" y="133" width="79" height="25" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="136.5" y="152" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="294.5" y="152" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="18" y="202" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">当前：P(upper | S)=0.25</text><rect x="18" y="218" width="79" height="25" rx="0" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><rect x="97" y="218" width="237" height="25" rx="0" fill="#258375" stroke="none" stroke-width="1.5" opacity="1"/><text x="57.5" y="237" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">A</text><text x="215.5" y="237" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="400" opacity="1">C</text><text x="16" y="302" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">reference = 1.26</text><path d="M251.7875 320L251.7875 493" fill="none" stroke="#52687b" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="5 5"/><text x="16" y="353" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">旧</text><rect x="62" y="335" width="162.675" height="25" rx="2" fill="#146ca1" stroke="none" stroke-width="1.5" opacity="1"/><text x="71" y="354" font-size="17" fill="#ffffff" text-anchor="start" font-weight="400" opacity="1">1.08</text><text x="62" y="393" font-size="17" fill="#146ca1" text-anchor="start" font-weight="400" opacity="1">选择 reference</text><text x="16" y="452" font-size="17" fill="#19354e" text-anchor="start" font-weight="400" opacity="1">当前</text><rect x="62" y="434" width="216.9" height="25" rx="2" fill="#b65a28" stroke="none" stroke-width="1.5" opacity="1"/><text x="71" y="453" font-size="17" fill="#ffffff" text-anchor="start" font-weight="400" opacity="1">1.44</text><text x="62" y="492" font-size="17" fill="#b65a28" text-anchor="start" font-weight="400" opacity="1">选择 route</text><path d="M62 510L303 510" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="62" y="535" font-size="16" fill="#52687b" text-anchor="middle" font-weight="400" opacity="1">0</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">条长为 Q；虚线是同一参照值</text></g><rect x="24" y="1386" width="352" height="602" rx="4" fill="#f5f8fb" stroke="none" stroke-width="1.5" opacity="1"/><g transform="translate(24 1386)"><text x="16" y="34" font-size="21" fill="#7854a2" text-anchor="start" font-weight="400" opacity="1">3 · A / C 合并成 Z</text><text x="16" y="68" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">行为未改；两个条件答案</text><text x="16" y="92" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">压到同一坐标</text><path d="M73.249 148.9335L150.6911 225.106" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M155.3251 229.6641L144.6897 226.2163L151.7021 219.087Z" fill="#7854a2"/><path d="M278.751 148.9335L201.3089 225.106" fill="none" stroke="#7854a2" stroke-width="3" stroke-linecap="round" opacity="1"/><path data-arrow-mode="actual" d="M196.6749 229.6641L200.2979 219.087L207.3103 226.2163Z" fill="#7854a2"/><circle cx="54" cy="130" r="24" fill="#ffffff" stroke="#146ca1" stroke-width="2.5" opacity="1"/><text x="54" y="137" font-size="22" fill="#146ca1" text-anchor="middle" font-weight="600" opacity="1">A</text><circle cx="298" cy="130" r="24" fill="#ffffff" stroke="#258375" stroke-width="2.5" opacity="1"/><text x="298" y="137" font-size="22" fill="#258375" text-anchor="middle" font-weight="600" opacity="1">C</text><text x="54" y="178" font-size="18" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">读出 1</text><text x="298" y="178" font-size="18" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">读出 2</text><circle cx="176" cy="250" r="27" fill="#ffffff" stroke="#7854a2" stroke-width="2.5" opacity="1"/><text x="176" y="257" font-size="22" fill="#7854a2" text-anchor="middle" font-weight="600" opacity="1">Z</text><text x="176" y="302" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">只能共用一个读出 c</text><path d="M32 365L320 365" fill="none" stroke="#19354e" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="32" cy="365" r="6" fill="#146ca1" stroke="none" stroke-width="2" opacity="1"/><text x="32" y="342" font-size="17" fill="#146ca1" text-anchor="middle" font-weight="400" opacity="1">A=1</text><circle cx="320" cy="365" r="6" fill="#258375" stroke="none" stroke-width="2" opacity="1"/><text x="320" y="342" font-size="17" fill="#258375" text-anchor="middle" font-weight="400" opacity="1">C=2</text><circle cx="176" cy="365" r="7" fill="#7854a2" stroke="none" stroke-width="2" opacity="1"/><path d="M176 375L176 416" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="176" y="445" font-size="19" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">c=1.5</text><path d="M32 394L176 394" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M176 394L320 394" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M32 388L32 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M176 388L176 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M320 388L320 400" fill="none" stroke="#7854a2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="104" y="422" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="248" y="422" font-size="16" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">0.5</text><text x="176" y="491" font-size="18" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">max(|c−1|, |c−2|)</text><text x="176" y="529" font-size="20" fill="#7854a2" text-anchor="middle" font-weight="400" opacity="1">最小可能最大误差 ≥ 0.5</text><text x="16" y="572" font-size="16" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">中点给出最小最大读出误差</text></g><text x="24" y="2027" font-size="18" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">K 已包含 γ^τ</text><text x="24" y="2056" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">所有量由同一脚本精确计算</text><text x="24" y="2085" font-size="17" fill="#52687b" text-anchor="start" font-weight="400" opacity="1">给定策略与读出；不是训练结果</text></g></svg>
